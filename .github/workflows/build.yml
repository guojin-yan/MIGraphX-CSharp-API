name: managed-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MIGRAPHX_WORKSPACE_ROOT: ${{ github.workspace }}/MIGraphXSharp.Workspace
  # Compile legacy TFMs, then run their smoke assemblies on the installed runtime.
  # Actual legacy runtime qualification is recorded separately from CI.
  DOTNET_ROLL_FORWARD: Major

concurrency:
  group: managed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-pack-docs:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ${{ github.workspace }}/MIGraphXSharp
    steps:
      - uses: actions/checkout@v7
        with:
          path: MIGraphXSharp
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: guojin-yan/HIP-CSharp-API
          ref: 7b6f75d0047bb87b72094aa910bcea8be2c5e2bc
          path: hip-source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: MIGraphXSharp/global.json
      - name: Restore tools
        shell: pwsh
        run: |
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { throw 'Tool restore failed.' }
      - name: Restore and build all 15 target frameworks
        shell: pwsh
        run: ./eng/build.ps1 -Configuration Release -HipSharpRepositoryRoot "$env:GITHUB_WORKSPACE/hip-source"
      - name: Verify frozen native ABI
        shell: pwsh
        run: |
          ./eng/generate-interop.ps1 -AcquireHeader -Verify
          ./eng/verify-native-abi.ps1 -AcquireInputs
      - name: Test and smoke
        shell: pwsh
        run: ./eng/test.ps1 -Configuration Release -NoBuild -HipSharpRepositoryRoot "$env:GITHUB_WORKSPACE/hip-source"
      - name: Pack and audit clean consumers
        shell: pwsh
        run: |
          $package = ./eng/pack.ps1 -Configuration Release -Version 1.0.0 -NoBuild | Select-Object -Last 1
          ./eng/verify-package.ps1 -PackagePath $package -Version 1.0.0
          $dependency = Join-Path $env:MIGRAPHX_WORKSPACE_ROOT 'downloads/JYPPX.ROCm.HIP.CSharp.API.1.0.0.nupkg'
          New-Item -ItemType Directory -Force -Path (Split-Path $dependency) | Out-Null
          Invoke-WebRequest 'https://api.nuget.org/v3-flatcontainer/jyppx.rocm.hip.csharp.api/1.0.0/jyppx.rocm.hip.csharp.api.1.0.0.nupkg' -OutFile $dependency
          $adapter = ./eng/pack-adapter.ps1 -Configuration Release -Version 1.0.0 -NoBuild -HipSharpPackagePath $dependency | Select-Object -Last 1
          ./eng/verify-adapter-package.ps1 -PackagePath $adapter -Version 1.0.0 -HipSharpPackagePath $dependency
      - name: Verify child process timeout and captured logs
        shell: pwsh
        run: ./eng/test-process-runner.ps1
      - name: Build DocFX site
        shell: pwsh
        run: ./eng/docs.ps1 -Configuration Release -NoBuild -HipSharpRepositoryRoot "$env:GITHUB_WORKSPACE/hip-source"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: managed-packages-and-docs-${{ matrix.os }}
          path: |
            ${{ env.MIGRAPHX_WORKSPACE_ROOT }}/artifacts/packages/*.nupkg
            ${{ env.MIGRAPHX_WORKSPACE_ROOT }}/artifacts/docs/**
            ${{ env.MIGRAPHX_WORKSPACE_ROOT }}/artifacts/process-runner-tests/**
          if-no-files-found: warn
