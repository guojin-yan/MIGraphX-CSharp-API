name: managed-build-manual

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  MIGRAPHX_WORKSPACE_ROOT: ${{ github.workspace }}/MIGraphXSharp.Workspace

jobs:
  build-test-pack-docs:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ github.workspace }}/MIGraphXSharp
    steps:
      - uses: actions/checkout@v7
        with:
          path: MIGraphXSharp
      - uses: actions/checkout@v7
        with:
          repository: guojin-yan/HIP-CSharp-API
          ref: 0c730005c37bacbd4f143b33d1f56e9ce517ac2f
          path: hip-source
          fetch-depth: 1
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: MIGraphXSharp/global.json
          cache: true
          cache-dependency-path: MIGraphXSharp/Directory.Packages.props
      - name: Restore tools and solution
        shell: pwsh
        run: |
          dotnet tool restore
          $hipRoot = Join-Path $env:GITHUB_WORKSPACE 'hip-source'
          dotnet restore ./MIGraphXSharp.sln "-p:HipSharpRepositoryRoot=$hipRoot"
      - name: Build all 15 target frameworks
        shell: pwsh
        run: ./eng/build.ps1 -Configuration Release -NoRestore -HipSharpRepositoryRoot "$env:GITHUB_WORKSPACE/hip-source"
      - name: Verify frozen native ABI
        shell: pwsh
        run: |
          ./eng/generate-interop.ps1 -AcquireHeader -Verify
          ./eng/verify-native-abi.ps1 -AcquireInputs
      - name: Test and smoke
        shell: pwsh
        run: ./eng/test.ps1 -Configuration Release -NoBuild -HipSharpRepositoryRoot "$env:GITHUB_WORKSPACE/hip-source"
      - name: Pack and audit clean consumers
        shell: pwsh
        run: |
          $package = ./eng/pack.ps1 -Configuration Release -Version 0.0.0 -NoBuild
          ./eng/verify-package.ps1 -PackagePath $package -Version 0.0.0
      - name: Build DocFX site
        shell: pwsh
        run: ./eng/docs.ps1 -Configuration Release -NoBuild -HipSharpRepositoryRoot "$env:GITHUB_WORKSPACE/hip-source"
      - uses: actions/upload-artifact@v7
        with:
          name: managed-packages-and-docs
          path: |
            ${{ env.MIGRAPHX_WORKSPACE_ROOT }}/artifacts/packages/*.nupkg
            ${{ env.MIGRAPHX_WORKSPACE_ROOT }}/artifacts/docs/**
          if-no-files-found: error
