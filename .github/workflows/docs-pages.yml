name: docs-pages-manual

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the generated site to GitHub Pages
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  MIGRAPHX_WORKSPACE_ROOT: ${{ github.workspace }}/MIGraphXSharp.Workspace

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ github.workspace }}/MIGraphXSharp
    steps:
      - uses: actions/checkout@v7
        with:
          path: MIGraphXSharp
      - uses: actions/checkout@v7
        with:
          repository: guojin-yan/HIP-CSharp-API
          ref: 7b6f75d0047bb87b72094aa910bcea8be2c5e2bc
          path: hip-source
          fetch-depth: 1
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: MIGraphXSharp/global.json
      - shell: pwsh
        run: |
          $hipRoot = Join-Path $env:GITHUB_WORKSPACE 'hip-source'
          ./eng/build.ps1 -Configuration Release -HipSharpRepositoryRoot $hipRoot
          ./eng/docs.ps1 -Configuration Release -NoBuild -HipSharpRepositoryRoot "$env:GITHUB_WORKSPACE/hip-source"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.MIGRAPHX_WORKSPACE_ROOT }}/artifacts/docs

  deploy:
    if: inputs.deploy && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
