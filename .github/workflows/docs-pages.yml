name: docs-pages-manual

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the generated site to GitHub Pages
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - shell: pwsh
        run: |
          dotnet restore ./MIGraphXSharp.sln
          ./eng/build.ps1 -Configuration Release -NoRestore
          ./eng/docs.ps1 -Configuration Release -NoBuild
      - uses: actions/upload-pages-artifact@v5
        with:
          path: artifacts/docs

  deploy:
    if: inputs.deploy && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
