<text x="64" y="849" font-size="22" fill="#a5b9d0" font-family="Microsoft YaHei" font-weight="400" dominant-baseline="text-before-edge">图像与文本编码器在 GPU；本例 resize、向量归一化、排序在 CPU，未使用 HIP 前后处理。</text>
