<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc"><title id="title">CLIP：两种 dtype，两套 program</title><desc id="desc">MIGraphX CSharp API 技术案例调用图。文本与图片分别编译；每侧独立 batch，输出复制成应用可长期保存的向量。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081322"/><stop offset="1" stop-color="#0c1d33"/></linearGradient><linearGradient id="panel" x2="1" y2="1"><stop stop-color="#142d47"/><stop offset="1" stop-color="#0b1b30"/></linearGradient><pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#48d6f2" stroke-opacity=".05"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="1800" height="1120" fill="url(#bg)"/><rect width="1800" height="1120" fill="url(#grid)"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="80" y="64" font-size="22" fill="#beabff" font-weight="700" letter-spacing="1">MIGraphX CSharp API / MODEL INTEGRATION</text><text x="80" y="141" font-size="48" fill="#eff6ff" font-weight="750" >CLIP：两种 dtype，两套 program</text><text x="80" y="193" font-size="25" fill="#a5b9d0" font-weight="500" >文本与图片分别编译；每侧独立 batch，输出复制成应用可长期保存的向量。</text><text x="80" y="262" font-size="22" fill="#beabff" font-weight="700" letter-spacing="1">TEXT / 启动时计算固定候选</text><rect x="80" y="300" width="480" height="205" rx="20" fill="url(#panel)" stroke="#beabff" stroke-opacity=".55" stroke-width="1.5"/><text x="104" y="343" font-size="30" fill="#beabff" font-weight="700" >long[] → Int64 [N,77]</text><text x="104" y="384" font-size="24" fill="#a5b9d0" font-weight="500" >input_ids：BPE ID</text><text x="104" y="419" font-size="24" fill="#a5b9d0" font-weight="500" >attention_mask：有效位置</text><text x="104" y="454" font-size="24" fill="#a5b9d0" font-weight="500" >Argument.Create&lt;long&gt; × 2</text><path d="M575 402H635" fill="none" stroke="#beabff" stroke-width="3"  marker-end="url(#arrow)"/><rect x="650" y="300" width="480" height="205" rx="20" fill="url(#panel)" stroke="#beabff" stroke-opacity=".55" stroke-width="1.5"/><text x="674" y="343" font-size="29" fill="#beabff" font-weight="700" >Text program</text><text x="674" y="384" font-size="24" fill="#a5b9d0" font-weight="500" >SetInputParameterShape × 2</text><text x="674" y="419" font-size="24" fill="#a5b9d0" font-weight="500" >Parse → Compile → Map.Add × 2</text><text x="674" y="454" font-size="24" fill="#a5b9d0" font-weight="500" >Run(map)</text><path d="M1145 402H1205" fill="none" stroke="#beabff" stroke-width="3"  marker-end="url(#arrow)"/><rect x="1220" y="300" width="500" height="205" rx="20" fill="url(#panel)" stroke="#67e3b6" stroke-opacity=".55" stroke-width="1.5"/><text x="1244" y="343" font-size="29" fill="#67e3b6" font-weight="700" >float32 [N,512]</text><text x="1244" y="384" font-size="24" fill="#a5b9d0" font-weight="500" >ToArray&lt;float&gt;() → L2 Normalize</text><text x="1244" y="419" font-size="24" fill="#a5b9d0" font-weight="500" >固定文本特征可缓存</text><text x="80" y="580" font-size="22" fill="#48d6f2" font-weight="700" letter-spacing="1">IMAGE / 后续图片复用编译后的 program</text><rect x="80" y="620" width="480" height="205" rx="20" fill="url(#panel)" stroke="#48d6f2" stroke-opacity=".55" stroke-width="1.5"/><text x="104" y="663" font-size="30" fill="#48d6f2" font-weight="700" >float[] → Float32</text><text x="104" y="704" font-size="24" fill="#a5b9d0" font-weight="500" >pixel_values: [B,3,224,224]</text><text x="104" y="739" font-size="24" fill="#a5b9d0" font-weight="500" >RGB / CHW / CLIP 归一化</text><text x="104" y="774" font-size="24" fill="#a5b9d0" font-weight="500" >Argument.Create&lt;float&gt;</text><path d="M575 720H635" fill="none" stroke="#48d6f2" stroke-width="3"  marker-end="url(#arrow)"/><rect x="650" y="620" width="480" height="205" rx="20" fill="url(#panel)" stroke="#48d6f2" stroke-opacity=".55" stroke-width="1.5"/><text x="674" y="663" font-size="29" fill="#48d6f2" font-weight="700" >Image program</text><text x="674" y="704" font-size="24" fill="#a5b9d0" font-weight="500" >SetInputParameterShape</text><text x="674" y="739" font-size="24" fill="#a5b9d0" font-weight="500" >Parse → Compile → Map.Add</text><text x="674" y="774" font-size="24" fill="#a5b9d0" font-weight="500" >Run(map)</text><path d="M1145 720H1205" fill="none" stroke="#48d6f2" stroke-width="3"  marker-end="url(#arrow)"/><rect x="1220" y="620" width="500" height="205" rx="20" fill="url(#panel)" stroke="#67e3b6" stroke-opacity=".55" stroke-width="1.5"/><text x="1244" y="663" font-size="29" fill="#67e3b6" font-weight="700" >float32 [B,512]</text><text x="1244" y="704" font-size="24" fill="#a5b9d0" font-weight="500" >ToArray&lt;float&gt;() → L2 Normalize</text><text x="1244" y="739" font-size="24" fill="#a5b9d0" font-weight="500" >仅取有效图片行</text><path d="M1600 517V566H1750V875H1600V905" fill="none" stroke="#67e3b6" stroke-width="3"  marker-end="url(#arrow)"/><path d="M1470 840V905" fill="none" stroke="#67e3b6" stroke-width="3"  marker-end="url(#arrow)"/><rect x="650" y="920" width="1070" height="80" rx="20" fill="url(#panel)" stroke="#ffc875" stroke-opacity=".55" stroke-width="1.5"/><text x="1185" y="971" font-size="29" fill="#ffc875" font-weight="650" text-anchor="middle">CPU 点积 / 排序：图片找文字，也可以文字找图片</text><text x="80" y="961" font-size="29" fill="#eff6ff" font-weight="650" >输出数组独立于原生集合</text><path d="M80 1035H1720" stroke="#294361"/><text x="80" y="1077" font-size="23" fill="#a5b9d0" font-weight="500" >编码器使用 MIGraphX GPU；本例图像前处理、归一化和检索排序仍在 CPU。</text><text x="1720" y="1077" font-size="20" fill="#a5b9d0" font-weight="500" text-anchor="end">Core 0.0.2 · main samples</text></g></svg>
