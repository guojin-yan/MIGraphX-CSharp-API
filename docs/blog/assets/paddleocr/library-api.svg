<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc"><title id="title">PaddleOCR：批量张量与执行完成点</title><desc id="desc">MIGraphX CSharp API 技术案例调用图。DET 与 REC 各自编译；worker 隔离可写资源，一轮全部提交后再等待。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081322"/><stop offset="1" stop-color="#0c1d33"/></linearGradient><linearGradient id="panel" x2="1" y2="1"><stop stop-color="#142d47"/><stop offset="1" stop-color="#0b1b30"/></linearGradient><pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#48d6f2" stroke-opacity=".05"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="1800" height="1120" fill="url(#bg)"/><rect width="1800" height="1120" fill="url(#grid)"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="80" y="64" font-size="22" fill="#67e3b6" font-weight="700" letter-spacing="1">MIGraphX CSharp API / MODEL INTEGRATION</text><text x="80" y="141" font-size="48" fill="#eff6ff" font-weight="750" >PaddleOCR：批量张量与执行完成点</text><text x="80" y="193" font-size="25" fill="#a5b9d0" font-weight="500" >DET 与 REC 各自编译；worker 隔离可写资源，一轮全部提交后再等待。</text><rect x="80" y="248" width="480" height="132" rx="20" fill="url(#panel)" stroke="#67e3b6" stroke-opacity=".55" stroke-width="1.5"/><text x="104" y="291" font-size="29" fill="#67e3b6" font-weight="700" >MIGraphXOnnxOptions</text><text x="104" y="332" font-size="24" fill="#a5b9d0" font-weight="500" >SetInputParameterShape(name, shape)</text><path d="M575 314H635" fill="none" stroke="#67e3b6" stroke-width="3"  marker-end="url(#arrow)"/><rect x="650" y="248" width="480" height="132" rx="20" fill="url(#panel)" stroke="#67e3b6" stroke-opacity=".55" stroke-width="1.5"/><text x="674" y="291" font-size="29" fill="#67e3b6" font-weight="700" >MIGraphXProgram</text><text x="674" y="332" font-size="24" fill="#a5b9d0" font-weight="500" >ParseOnnxFile → GetParameterShapes</text><path d="M1145 314H1205" fill="none" stroke="#67e3b6" stroke-width="3"  marker-end="url(#arrow)"/><rect x="1220" y="248" width="500" height="132" rx="20" fill="url(#panel)" stroke="#67e3b6" stroke-opacity=".55" stroke-width="1.5"/><text x="1244" y="291" font-size="29" fill="#67e3b6" font-weight="700" >Compile(target, options)</text><text x="1244" y="332" font-size="24" fill="#a5b9d0" font-weight="500" >gpu target · 明确 offloadCopy</text><text x="80" y="438" font-size="22" fill="#67e3b6" font-weight="700" letter-spacing="1">DET: x[1,3,H,W] → DB / CROP → REC: x[B,3,48,Wrec]</text><rect x="80" y="480" width="480" height="300" rx="20" fill="url(#panel)" stroke="#48d6f2" stroke-opacity=".55" stroke-width="1.5"/><text x="104" y="523" font-size="29" fill="#48d6f2" font-weight="700" >批次与有效行数</text><text x="104" y="564" font-size="24" fill="#a5b9d0" font-weight="500" >B=4 是 program 输入形状</text><text x="104" y="599" font-size="24" fill="#a5b9d0" font-weight="500" >完整数组：B × 3 × 48 × Wrec</text><text x="104" y="634" font-size="24" fill="#a5b9d0" font-weight="500" >尾批补零，只读取 count 行</text><text x="104" y="669" font-size="24" fill="#a5b9d0" font-weight="500" >字典匹配输出 [B,T,C]</text><path d="M575 570H610V550H655" fill="none" stroke="#67e3b6" stroke-width="3"  marker-end="url(#arrow)"/><path d="M575 690H610V720H655" fill="none" stroke="#67e3b6" stroke-width="3"  marker-end="url(#arrow)"/><rect x="670" y="480" width="490" height="138" rx="20" fill="url(#panel)" stroke="#67e3b6" stroke-opacity=".55" stroke-width="1.5"/><text x="694" y="523" font-size="29" fill="#67e3b6" font-weight="700" >Worker 1 · 独立资源</text><text x="694" y="564" font-size="24" fill="#a5b9d0" font-weight="500" >program + stream + input/output</text><rect x="670" y="650" width="490" height="138" rx="20" fill="url(#panel)" stroke="#beabff" stroke-opacity=".55" stroke-width="1.5"/><text x="694" y="693" font-size="29" fill="#beabff" font-weight="700" >Worker 2 · 独立资源</text><text x="694" y="734" font-size="24" fill="#a5b9d0" font-weight="500" >program + stream + input/output</text><path d="M1175 550H1225" fill="none" stroke="#67e3b6" stroke-width="3"  marker-end="url(#arrow)"/><path d="M1175 720H1225" fill="none" stroke="#67e3b6" stroke-width="3"  marker-end="url(#arrow)"/><rect x="1240" y="480" width="480" height="138" rx="20" fill="url(#panel)" stroke="#67e3b6" stroke-opacity=".55" stroke-width="1.5"/><text x="1264" y="523" font-size="29" fill="#67e3b6" font-weight="700" >提交 → GPU CTC</text><text x="1264" y="564" font-size="24" fill="#a5b9d0" font-weight="500" >RunDeviceIntoAsync → kernel</text><rect x="1240" y="650" width="480" height="138" rx="20" fill="url(#panel)" stroke="#beabff" stroke-opacity=".55" stroke-width="1.5"/><text x="1264" y="693" font-size="29" fill="#beabff" font-weight="700" >提交 → GPU CTC</text><text x="1264" y="734" font-size="24" fill="#a5b9d0" font-weight="500" >RunDeviceIntoAsync → kernel</text><path d="M1480 800V850H915V865" fill="none" stroke="#67e3b6" stroke-width="3"  marker-end="url(#arrow)"/><path d="M1720 550H1750V850H1480" fill="none" stroke="#67e3b6" stroke-width="3"  marker-end="url(#arrow)"/><rect x="670" y="880" width="1050" height="116" rx="20" fill="url(#panel)" stroke="#ffc875" stroke-opacity=".55" stroke-width="1.5"/><text x="694" y="923" font-size="29" fill="#ffc875" font-weight="700" >MIGraphXHipAsyncRun.Synchronize()</text><text x="694" y="964" font-size="24" fill="#a5b9d0" font-weight="500" >本轮完成 → 按原行号读回 → 才能复用同一 worker 的缓冲</text><text x="80" y="858" font-size="35" fill="#eff6ff" font-weight="700" >先全部提交</text><text x="80" y="906" font-size="35" fill="#eff6ff" font-weight="700" >再等待整轮完成</text><path d="M80 1035H1720" stroke="#294361"/><text x="80" y="1077" font-size="23" fill="#a5b9d0" font-weight="500" >独立 stream 提供调度机会；实际并行收益取决于模型、显存与工作量。</text><text x="1720" y="1077" font-size="20" fill="#a5b9d0" font-weight="500" text-anchor="end">Core 0.0.2 · main samples</text></g></svg>
