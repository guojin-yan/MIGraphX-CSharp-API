<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc"><title id="title">PP-Structure：命名输入与循环状态</title><desc id="desc">MIGraphX CSharp API 技术案例调用图。多输入靠参数名绑定，混合输出按 DataType 读取，下一步状态有明确所有权。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081322"/><stop offset="1" stop-color="#0c1d33"/></linearGradient><linearGradient id="panel" x2="1" y2="1"><stop stop-color="#142d47"/><stop offset="1" stop-color="#0b1b30"/></linearGradient><pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#48d6f2" stroke-opacity=".05"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="1800" height="1120" fill="url(#bg)"/><rect width="1800" height="1120" fill="url(#grid)"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="80" y="64" font-size="22" fill="#ffc875" font-weight="700" letter-spacing="1">MIGraphX CSharp API / MODEL INTEGRATION</text><text x="80" y="141" font-size="48" fill="#eff6ff" font-weight="750" >PP-Structure：命名输入与循环状态</text><text x="80" y="193" font-size="25" fill="#a5b9d0" font-weight="500" >多输入靠参数名绑定，混合输出按 DataType 读取，下一步状态有明确所有权。</text><text x="80" y="260" font-size="22" fill="#ffc875" font-weight="700" letter-spacing="1">LAYOUT / 三个输入属于同一次执行</text><rect x="80" y="300" width="470" height="125" rx="20" fill="url(#panel)" stroke="#48d6f2" stroke-opacity=".55" stroke-width="1.5"/><text x="104" y="343" font-size="29" fill="#48d6f2" font-weight="700" >image · float32</text><text x="104" y="384" font-size="24" fill="#a5b9d0" font-weight="500" >[1,3,640,640]</text><rect x="80" y="450" width="470" height="125" rx="20" fill="url(#panel)" stroke="#ffc875" stroke-opacity=".55" stroke-width="1.5"/><text x="104" y="493" font-size="29" fill="#ffc875" font-weight="700" >im_shape / scale_factor</text><text x="104" y="534" font-size="24" fill="#a5b9d0" font-weight="500" >float32 [1,2] + float32 [1,2]</text><path d="M565 362H605V415H645" fill="none" stroke="#67e3b6" stroke-width="3"  marker-end="url(#arrow)"/><path d="M565 512H605V475H645" fill="none" stroke="#67e3b6" stroke-width="3"  marker-end="url(#arrow)"/><rect x="660" y="365" width="500" height="170" rx="20" fill="url(#panel)" stroke="#ffc875" stroke-opacity=".55" stroke-width="1.5"/><text x="684" y="408" font-size="29" fill="#ffc875" font-weight="700" >MIGraphXParameterMap</text><text x="684" y="449" font-size="24" fill="#a5b9d0" font-weight="500" >Add("image", ...)</text><text x="684" y="484" font-size="24" fill="#a5b9d0" font-weight="500" >Add 两个辅助输入</text><path d="M1175 450H1225" fill="none" stroke="#67e3b6" stroke-width="3"  marker-end="url(#arrow)"/><rect x="1240" y="365" width="480" height="170" rx="20" fill="url(#panel)" stroke="#67e3b6" stroke-opacity=".55" stroke-width="1.5"/><text x="1264" y="408" font-size="28" fill="#67e3b6" font-weight="700" >program.Run(map)</text><text x="1264" y="449" font-size="24" fill="#a5b9d0" font-weight="500" >Shape.DataType → ToArray&lt;T&gt;()</text><text x="1264" y="484" font-size="24" fill="#a5b9d0" font-weight="500" >float 框与整数计数分别读取</text><text x="80" y="650" font-size="22" fill="#beabff" font-weight="700" letter-spacing="1">TABLE / 编码器与单步模型分别复用</text><rect x="80" y="690" width="470" height="195" rx="20" fill="url(#panel)" stroke="#48d6f2" stroke-opacity=".55" stroke-width="1.5"/><text x="104" y="733" font-size="29" fill="#48d6f2" font-weight="700" >Encoder program</text><text x="104" y="774" font-size="24" fill="#a5b9d0" font-weight="500" >x[1,3,512,512]</text><text x="104" y="809" font-size="24" fill="#a5b9d0" font-weight="500" >memory0: float32 [1,256,512]</text><path d="M565 790H645" fill="none" stroke="#67e3b6" stroke-width="3"  marker-end="url(#arrow)"/><rect x="660" y="690" width="500" height="195" rx="20" fill="url(#panel)" stroke="#beabff" stroke-opacity=".55" stroke-width="1.5"/><text x="684" y="733" font-size="29" fill="#beabff" font-weight="700" >Step program</text><text x="684" y="774" font-size="24" fill="#a5b9d0" font-weight="500" >hidden: float32 [1,512]</text><text x="684" y="809" font-size="24" fill="#a5b9d0" font-weight="500" >token: int32 [1]；memory0 复用</text><path d="M1175 790H1225" fill="none" stroke="#67e3b6" stroke-width="3"  marker-end="url(#arrow)"/><rect x="1240" y="690" width="480" height="195" rx="20" fill="url(#panel)" stroke="#67e3b6" stroke-opacity=".55" stroke-width="1.5"/><text x="1264" y="733" font-size="26" fill="#67e3b6" font-weight="700" >ToArray&lt;float/int/long&gt;()</text><text x="1264" y="774" font-size="24" fill="#a5b9d0" font-weight="500" >复制下一步 hidden 与 token</text><text x="1264" y="809" font-size="24" fill="#a5b9d0" font-weight="500" >EOS=49 停止；最多 501 步</text><path d="M1480 898V960H915V900" fill="none" stroke="#beabff" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/><text x="1010" y="997" font-size="23" fill="#a5b9d0" font-weight="500" >C# 更新状态；当前经主机数组传递</text><path d="M80 1035H1720" stroke="#294361"/><text x="80" y="1077" font-size="23" fill="#a5b9d0" font-weight="500" >循环在 C#；模型在 GPU；表格状态尚未全程留在显存。公式另选 ORT CPU。</text><text x="1720" y="1077" font-size="20" fill="#a5b9d0" font-weight="500" text-anchor="end">Core 0.0.2 · main samples</text></g></svg>
