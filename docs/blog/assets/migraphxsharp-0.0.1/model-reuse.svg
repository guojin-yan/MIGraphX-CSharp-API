troke="#234c77" stroke-width="0.8" opacity=".15"/><text x="80" y="66" font-size="18" fill="#49e3ce" font-weight="650" letter-spacing="3">PARSE ONCE / COMPILE ONCE / RUN MANY</text><text x="80" y="136" font-size="51" fill="#eef7ff" font-weight="750" >模型准备一次，后续重复推理</text><text x="80" y="183" font-size="24" fill="#9fb7cf" font-weight="400" >加载和编译放在初始化阶段，每次调用准备自己的输入参数。</text><rect x="80" y="252" width="440" height="385" rx="26" fill="url(#card)" stroke="#55bcff77" /><rect x="110" y="281" width="132" height="40" rx="20" fill="#55bcff12" stroke="#55bcff88" /><text x="176" y="308" font-size="18" fill="#55bcff" font-weight="650" text-anchor="middle" letter-spacing="1">初始化</text><g transform="translate(266 347) scale(1.05)" fill="none" stroke="#55bcff" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19L7 33L22 47M44 19L59 33L44 47M38 10L28 56"/></g><text x="300" y="472" font-size="31" fill="#eef7ff" font-weight="700" text-anchor="middle">加载 ONNX</text><text x="300" y="528" font-size="25" fill="#55bcff" font-weight="500" text-anchor="middle">ParseOnnxFile</text><text x="300" y="579" font-size="25" fill="#55bcff" font-weight="500" text-anchor="middle">Compile → GPU</text><rect x="620" y="252" width="810" height="385" rx="26" fill="url(#card)" stroke="#49e3ce88" /><rect x="650" y="281" width="188" height="40" rx="20" fill="#49e3ce12" stroke="#49e3ce88" /><text x="744" y="308" font-size="18" fill="#49e3ce" font-weight="650" text-anchor="middle" letter-spacing="1">保留 program</text><text x="1025" y="385" font-size="30" fill="#eef7ff" font-weight="700" text-anchor="middle">每次请求</text><rect x="652" y="419" width="224" height="134" rx="18" fill="#0a1d2e" stroke="#2c626d" /><g transform="translate(668 438) scale(0.6)" fill="none" stroke="#49e3ce" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 19L34 7L58 21V48L33 60L8 46ZM8 19L33 33L58 21M33 33V60M20 13L46 27V54M8 33L33 47L58 35"/></g><text x="764" y="503" font-size="24" fill="#eef7ff" font-weight="650" text-anchor="middle">准备输入</text><text x="764" y="535" font-size="18" fill="#9fb7cf" font-weight="400" text-anchor="middle">Argument / Map</text><path d="M881 478L903 478" fill="none" stroke="#49e3ce" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="910" y="419" width="224" height="134" rx="18" fill="#0a1d2e" stroke="#2c626d" /><g transform="translate(926 438) scale(0.6)" fill="none" stroke="#49e3ce" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="14" width="38" height="38" rx="6"/><rect x="23" y="23" width="20" height="20" rx="2"/><path d="M22 5V14M33 5V14M44 5V14M22 52V61M33 52V61M44 52V61M5 22H14M5 33H14M5 44H14M52 22H61M52 33H61M52 44H61"/></g><text x="1022" y="503" font-size="24" fill="#eef7ff" font-weight="650" text-anchor="middle">执行模型</text><text x="1022" y="535" font-size="18" fill="#9fb7cf" font-weight="400" text-anchor="middle">program.Run</text><path d="M1139 478L1161 478" fill="none" stroke="#49e3ce" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1168" y="419" width="224" height="134" rx="18" fill="#0a1d2e" stroke="#2c626d" /><g transform="translate(1184 438) scale(0.6)" fill="none" stroke="#49e3ce" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="50" height="50" rx="7"/><path d="M18 22L24 28L32 18M39 23H49M18 41L24 47L32 37M39 42H49"/></g><text x="1280" y="503" font-size="24" fill="#eef7ff" font-weight="650" text-anchor="middle">读取结果</text><text x="1280" y="535" font-size="18" fill="#9fb7cf" font-weight="400" text-anchor="middle">ToArray&lt;T&gt;</text><path d="M1280 561V596H764V562" fill="none" stroke="#49e3ce" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#arrow)"/><text x="1025" y="622" font-size="21" fill="#49e3ce" font-weight="400" text-anchor="middle">同一 program，顺序处理新的输入</text><rect x="1530" y="252" width="190" height="385" rx="26" fill="url(#card)" stroke="#ff957e88" /><g transform="translate(1590 351) scale(0.95)" fill="none" stroke="#ff957e" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M33 7L56 16V32Q55 49 33 60Q11 49 10 32V16Z"/><path d="M22 33L29 40L45 24"/></g><text x="1625" y="472" font-size="28" fill="#eef7ff" font-weight="700" text-anchor="middle">结束使用</text><text x="1625" y="528" font-size="25" fill="#ff957e" font-weight="550" text-anchor="middle">Dispose</text><text x="1625" y="574" font-size="22" fill="#9fb7cf" font-weight="400" text-anchor="middle">释放资源</text><path d="M525 447L607 447" fill="none" stroke="#49e3ce" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1434 447L1517 447" fill="none" stroke="#49e3ce" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="210" y="682" width="1380" height="78" rx="20" fill="#102238" stroke="#34475f" /><text x="900" y="732" font-size="26" fill="#eef7ff" font-weight="500" text-anchor="middle">每次输入与输出使用 using 管理；模型停用时再释放 program。</text><path d="M80 790L1720 790" fill="none" stroke="#24405b" stroke-width="1" /><text x="80" y="828" font-size="17" fill="#9fb7cf" font-weight="500" >MIGraphXSharp  /  v0.0.1</text><text x="1720" y="828" font-size="17" fill="#9fb7cf" font-weight="400" text-anchor="end">模型复用方式示意  ·  便捷 RunFile 则在一次调用内完成解析、编译和执行</text></g></svg>