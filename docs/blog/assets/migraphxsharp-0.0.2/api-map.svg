<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc"><title id="title">MIGraphX CSharp API 模型、张量和推理 API 的关系</title><desc id="desc">MIGraphX CSharp API 0.0.2 发布文章原创技术配图，准确标签与数据由 SVG 排版。</desc><defs>
