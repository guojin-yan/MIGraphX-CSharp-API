</defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect width="1800" height="1000" fill="url(#background)"/><rect width="1800" height="1000" fill="url(#grid)"/><ellipse cx="1450" cy="270" rx="720" ry="470" fill="url(#halo)"/><path d="M1120 0L1800 160" fill="none" stroke="#37c9e3" stroke-width="1.6" opacity=".15"/><path d="M1146 0L1800 178" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><path d="M1172 0L1800 196" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><path d="M1198 0L1800 214" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><path d="M1224 0L1800 232" fill="none" stroke="#37c9e3" stroke-width="1.6" opacity=".15"/><path d="M1250 0L1800 250" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><path d="M1276 0L1800 268" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><path d="M1302 0L1800 286" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><path d="M1328 0L1800 304" fill="none" stroke="#37c9e3" stroke-width="1.6" opacity=".15"/><path d="M1354 0L1800 322" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><path d="M1380 0L1800 340" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><path d="M1406 0L1800 358" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><path d="M1432 0L1800 376" fill="none" stroke="#37c9e3" stroke-width="1.6" opacity=".15"/><path d="M1458 0L1800 394" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><path d="M1484 0L1800 412" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><path d="M1510 0L1800 430" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><path d="M1536 0L1800 448" fill="none" stroke="#37c9e3" stroke-width="1.6" opacity=".15"/><path d="M1562 0L1800 466" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><path d="M1588 0L1800 484" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><path d="M1614 0L1800 502" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><text x="80" y="66" font-size="18" fill="#49e3ce" font-weight="650" letter-spacing="3">MODEL / TENSOR / EXECUTION</text><text x="80" y="136" font-size="51" fill="#eef7ff" font-weight="750" >常用 API，按一次调用串起来</text><text x="80" y="183" font-size="24" fill="#9fb7cf" font-weight="400" >上方配置模型，下方准备输入、绑定名称并读取结果。</text><rect x="80" y="252" width="470" height="190" rx="24" fill="url(#card)" stroke="#55bcff80" /><g transform="translate(110 278) scale(0.8)" fill="none" stroke="#55bcff" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19L7 33L22 47M44 19L59 33L44 47M38 10L28 56"/></g><text x="202" y="298" font-size="29" fill="#eef7ff" font-weight="650" >ONNX 解析选项</text><text x="110" y="361" font-size="29" fill="#55bcff" font-weight="600" >MIGraphXOnnxOptions</text><text x="110" y="407" font-size="23" fill="#9fb7cf" font-weight="400" >输入尺寸 / 动态维度范围</text><rect x="650" y="264" width="510" height="225" rx="26" fill="url(#chip)" stroke="#49e3ceb0" /><g transform="translate(680 293) scale(0.85)" fill="none" stroke="#49e3ce" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="14" width="38" height="38" rx="6"/><rect x="23" y="23" width="20" height="20" rx="2"/><path d="M22 5V14M33 5V14M44 5V14M22 52V61M33 52V61M44 52V61M5 22H14M5 33H14M5 44H14M52 22H61M52 33H61M52 44H61"/></g><text x="775" y="320" font-size="34" fill="#eef7ff" font-weight="700" >MIGraphXProgram</text><text x="690" y="381" font-size="24" fill="#49e3ce" font-weight="400" >ParseOnnxFile / ParseOnnxBuffer</text><text x="690" y="430" font-size="24" fill="#eef7ff" font-weight="400" >Compile / Run / Save / Load</text><rect x="1260" y="252" width="460" height="190" rx="24" fill="url(#card)" stroke="#ac99ff80" /><text x="1290" y="302" font-size="29" fill="#eef7ff" font-weight="650" >GPU 编译配置</text><text x="1290" y="355" font-size="27" fill="#ac99ff" font-weight="600" >MIGraphXTarget</text><text x="1290" y="400" font-size="25" fill="#ac99ff" font-weight="500" >MIGraphXCompileOptions</text><path d="M552 350L638 350" fill="none" stroke="#49e3ce" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1257 350L1171 350" fill="none" stroke="#ac99ff" stroke-width="2.5" marker-end="url(#purple-arrow)"/><text x="595" y="326" font-size="20" fill="#49e3ce" font-weight="400" text-anchor="middle">解析</text><text x="1210" y="326" font-size="20" fill="#ac99ff" font-weight="400" text-anchor="middle">编译</text><rect x="80" y="598" width="300" height="230" rx="24" fill="url(#card)" stroke="#55bcff70" /><g transform="translate(193 625) scale(1.1)" fill="none" stroke="#55bcff" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="10" width="50" height="45" rx="7"/><circle cx="23" cy="24" r="5"/><path d="M10 47L25 34L35 42L45 29L57 43"/></g><text x="230" y="746" font-size="31" fill="#eef7ff" font-weight="700" text-anchor="middle">float[]</text><text x="230" y="793" font-size="21" fill="#55bcff" font-weight="400" text-anchor="middle">C# 输入数据</text><path d="M386 705L406 705" fill="none" stroke="#49e3ce" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="415" y="598" width="300" height="230" rx="24" fill="url(#card)" stroke="#55bcff70" /><g transform="translate(528 625) scale(1.1)" fill="none" stroke="#55bcff" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 19L34 7L58 21V48L33 60L8 46ZM8 19L33 33L58 21M33 33V60M20 13L46 27V54M8 33L33 47L58 35"/></g><text x="565" y="746" font-size="31" fill="#eef7ff" font-weight="700" text-anchor="middle">Argument</text><text x="565" y="793" font-size="21" fill="#55bcff" font-weight="400" text-anchor="middle">MIGraphXArgument</text><path d="M721 705L741 705" fill="none" stroke="#49e3ce" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="750" y="598" width="300" height="230" rx="24" fill="url(#card)" stroke="#49e3ce70" /><g transform="translate(863 625) scale(1.1)" fill="none" stroke="#49e3ce" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 23L33 8L61 23L33 38ZM5 35L33 50L61 35M5 47L33 62L61 47"/></g><text x="900" y="746" font-size="29" fill="#eef7ff" font-weight="700" text-anchor="middle">ParameterMap</text><text x="900" y="793" font-size="21" fill="#49e3ce" font-weight="400" text-anchor="middle">按输入名称绑定</text><path d="M1056 705L1076 705" fill="none" stroke="#49e3ce" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1085" y="598" width="300" height="230" rx="24" fill="url(#card)" stroke="#49e3ce70" /><g transform="translate(1198 625) scale(1.1)" fill="none" stroke="#49e3ce" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="14" width="38" height="38" rx="6"/><rect x="23" y="23" width="20" height="20" rx="2"/><path d="M22 5V14M33 5V14M44 5V14M22 52V61M33 52V61M44 52V61M5 22H14M5 33H14M5 44H14M52 22H61M52 33H61M52 44H61"/></g><text x="1235" y="746" font-size="31" fill="#eef7ff" font-weight="700" text-anchor="middle">Program.Run</text><text x="1235" y="793" font-size="21" fill="#49e3ce" font-weight="400" text-anchor="middle">同步执行</text><path d="M1391 705L1411 705" fill="none" stroke="#49e3ce" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1420" y="598" width="300" height="230" rx="24" fill="url(#card)" stroke="#ac99ff70" /><g transform="translate(1533 625) scale(1.1)" fill="none" stroke="#ac99ff" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="50" height="50" rx="7"/><path d="M18 22L24 28L32 18M39 23H49M18 41L24 47L32 37M39 42H49"/></g><text x="1570" y="746" font-size="31" fill="#eef7ff" font-weight="700" text-anchor="middle">ToArray&lt;T&gt;</text><text x="1570" y="793" font-size="21" fill="#ac99ff" font-weight="400" text-anchor="middle">C# 输出数组</text><path d="M905 491V538H1235V584" fill="none" stroke="#49e3ce" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1038" y="522" font-size="21" fill="#49e3ce" font-weight="400" text-anchor="middle">已编译的模型程序</text><text x="80" y="887" font-size="24" fill="#9fb7cf" font-weight="400" >Shape 描述张量类型、尺寸与布局；Argument 保存数据；ParameterMap 绑定模型输入名称。</text><path d="M80 930L1720 930" fill="none" stroke="#24405b" stroke-width="1" /><text x="80" y="968" font-size="17" fill="#9fb7cf" font-weight="500" >MIGraphX CSharp API  /  v0.0.2</text><text x="1720" y="968" font-size="17" fill="#9fb7cf" font-weight="400" text-anchor="end">同步主机输入示意  ·  Compile 使用 offloadCopy: true</text></g></svg>