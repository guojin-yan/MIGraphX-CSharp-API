<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
  <title id="title">PP-OCRv6：文本行分批与双实例识别</title>
  <desc id="desc">16 行文字按 batch 4 分成四批，每轮向两个独立识别实例各提交一批，等待本轮完成后继续下一轮，结果按原始行号回填。各实例独立持有模型、HIP Stream 和可写显存缓冲区。本图为调度示意，并非 GPU 执行时间线。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050d1b"/><stop offset=".52" stop-color="#09192c"/><stop offset="1" stop-color="#05101d"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10263f"/><stop offset="1" stop-color="#0a1829"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#0d8694" stop-opacity=".27"/><stop offset="1" stop-color="#062c42" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#77b9ef" stroke-opacity=".055"/></pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10" fill="none" stroke="#49e3ce" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
    <rect width="1800" height="1000" fill="url(#background)"/>
    <rect width="1800" height="1000" fill="url(#grid)"/>
    <ellipse cx="1450" cy="270" rx="720" ry="470" fill="url(#halo)"/>
    <path d="M1120 0L1800 160M1180 0L1800 200M1240 0L1800 240M1300 0L1800 280" fill="none" stroke="#37c9e3" stroke-width="1" opacity=".15"/>

    <text x="80" y="66" font-size="18" fill="#49e3ce" font-weight="650" letter-spacing="3">OCR / BATCH + MULTIPLE INSTANCES</text>
    <text x="80" y="136" font-size="51" fill="#eef7ff" font-weight="750">16 行文字，分成四批交给两个实例</text>
    <text x="80" y="183" font-size="24" fill="#9fb7cf">batch = 4 · 每轮先提交两个实例，再等待完成 · 处理结束后恢复文本阅读顺序</text>

    <rect x="80" y="274" width="320" height="450" rx="26" fill="url(#card)" stroke="#55bcff88"/>
    <text x="112" y="323" font-size="30" fill="#eef7ff" font-weight="700">已检测的文本行</text>
    <text x="112" y="361" font-size="21" fill="#9fb7cf">按原行号分组</text>
    <g font-size="25" font-weight="600" text-anchor="middle">
      <rect x="112" y="390" width="256" height="62" rx="13" fill="#142c45" stroke="#55bcff88"/>
      <text x="240" y="430" fill="#55bcff">第 1–4 行</text>
      <rect x="112" y="467" width="256" height="62" rx="13" fill="#1b2848" stroke="#ac99ff88"/>
      <text x="240" y="507" fill="#ac99ff">第 5–8 行</text>
      <rect x="112" y="544" width="256" height="62" rx="13" fill="#142c45" stroke="#55bcff88"/>
      <text x="240" y="584" fill="#55bcff">第 9–12 行</text>
      <rect x="112" y="621" width="256" height="62" rx="13" fill="#1b2848" stroke="#ac99ff88"/>
      <text x="240" y="661" fill="#ac99ff">第 13–16 行</text>
    </g>

    <path d="M405 499H472V376H550" fill="none" stroke="#49e3ce" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M472 499V611H550" fill="none" stroke="#49e3ce" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="470" y="470" text-anchor="middle" font-size="19" fill="#49e3ce">分批</text>

    <text x="740" y="247" font-size="22" fill="#49e3ce" font-weight="600" text-anchor="middle">第 1 轮</text>
    <text x="1070" y="247" font-size="22" fill="#49e3ce" font-weight="600" text-anchor="middle">第 2 轮</text>
    <path d="M905 270V730" stroke="#3b5369" stroke-width="1.5" stroke-dasharray="5 9"/>

    <rect x="560" y="274" width="710" height="215" rx="24" fill="url(#card)" stroke="#55bcff88"/>
    <circle cx="593" cy="310" r="6" fill="#55bcff"/>
    <text x="613" y="320" font-size="29" fill="#eef7ff" font-weight="700">识别实例 1</text>
    <text x="593" y="353" font-size="21" fill="#9fb7cf">独立 program · Stream · 可写显存缓冲区</text>
    <rect x="600" y="376" width="280" height="72" rx="14" fill="#142c45" stroke="#55bcff88"/>
    <text x="740" y="422" font-size="25" fill="#55bcff" font-weight="650" text-anchor="middle">批次 1 / 第 1–4 行</text>
    <path d="M887 412H922" fill="none" stroke="#49e3ce" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="930" y="376" width="280" height="72" rx="14" fill="#142c45" stroke="#55bcff88"/>
    <text x="1070" y="422" font-size="25" fill="#55bcff" font-weight="650" text-anchor="middle">批次 3 / 第 9–12 行</text>

    <rect x="560" y="509" width="710" height="215" rx="24" fill="url(#card)" stroke="#ac99ff88"/>
    <circle cx="593" cy="545" r="6" fill="#ac99ff"/>
    <text x="613" y="555" font-size="29" fill="#eef7ff" font-weight="700">识别实例 2</text>
    <text x="593" y="588" font-size="21" fill="#9fb7cf">独立 program · Stream · 可写显存缓冲区</text>
    <rect x="600" y="611" width="280" height="72" rx="14" fill="#1b2848" stroke="#ac99ff88"/>
    <text x="740" y="657" font-size="25" fill="#ac99ff" font-weight="650" text-anchor="middle">批次 2 / 第 5–8 行</text>
    <path d="M887 647H922" fill="none" stroke="#49e3ce" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="930" y="611" width="280" height="72" rx="14" fill="#1b2848" stroke="#ac99ff88"/>
    <text x="1070" y="657" font-size="25" fill="#ac99ff" font-weight="650" text-anchor="middle">批次 4 / 第 13–16 行</text>

    <path d="M1275 412H1345V499M1275 647H1345V499H1410" fill="none" stroke="#49e3ce" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="1420" y="274" width="300" height="450" rx="26" fill="url(#card)" stroke="#49e3ce88"/>
    <text x="1570" y="337" font-size="31" fill="#eef7ff" font-weight="700" text-anchor="middle">结果回填</text>
    <text x="1570" y="380" font-size="22" fill="#49e3ce" text-anchor="middle">按原行号整理</text>
    <g stroke="#7ea6c0" stroke-width="5" stroke-linecap="round">
      <path d="M1500 429H1649M1500 472H1622M1500 515H1649M1500 558H1600M1500 601H1630"/>
    </g>
    <g font-size="20" fill="#49e3ce" text-anchor="middle"><text x="1470" y="436">1</text><text x="1470" y="479">2</text><text x="1470" y="522">3</text><text x="1470" y="565">…</text><text x="1470" y="608">16</text></g>
    <text x="1570" y="675" font-size="23" fill="#9fb7cf" text-anchor="middle">输出文字与置信度</text>

    <rect x="210" y="787" width="1380" height="102" rx="21" fill="#102238" stroke="#34475f"/>
    <text x="900" y="829" font-size="26" fill="#eef7ff" font-weight="600" text-anchor="middle">每批：透视裁剪与归一化 → MIGraphX 识别 → HIP CTC 解码</text>
    <text x="900" y="866" font-size="22" fill="#9fb7cf" text-anchor="middle">末批不足时补零，只解码有效行；模型须支持所选 batch，实例数与 batch 会增加显存占用。</text>
    <path d="M80 930H1720" stroke="#24405b"/>
    <text x="80" y="968" font-size="17" fill="#9fb7cf">MIGraphXSharp / v0.0.2</text>
    <text x="1720" y="968" font-size="17" fill="#9fb7cf" text-anchor="end">调度示意，非 GPU 执行时间线 · 不表示两个实例必定等比例提速</text>
  </g>
</svg>
