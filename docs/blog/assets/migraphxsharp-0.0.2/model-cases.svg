<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
<title id="title">MIGraphXSharp 四类独立应用案例</title><desc id="desc">四个自包含 C# 示例：YOLO26、PaddleOCR、PP-Structure 与 CLIP。分别标出输出与计算位置；文档公式显式使用 ORT CPU，CLIP 图像前后处理在 CPU。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050e1c"/><stop offset="1" stop-color="#0c1d33"/></linearGradient><linearGradient id="card" x2="1" y2="1"><stop stop-color="#122b46"/><stop offset="1" stop-color="#0a1729"/></linearGradient><pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#55bcff" stroke-opacity=".045"/></pattern></defs>
<rect width="1800" height="1120" fill="url(#bg)"/><rect width="1800" height="1120" fill="url(#grid)"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><text x="80" y="68" font-size="22" fill="#49e3ce" font-weight="700">MIGraphXSharp / FOUR APPLICATIONS</text><text x="80" y="140" font-size="49" fill="#eff6ff" font-weight="800">从视觉识别，到文档处理与图文检索</text><text x="80" y="190" font-size="26" fill="#a5b9d0" font-weight="500">四个独立 C# 项目，各自包含模型调用、前后处理、结果导出与计时。</text><rect x="80" y="245" width="790" height="350" rx="22" fill="url(#card)" stroke="#60caff88" stroke-width="2"/><text x="115" y="304" font-size="40" fill="#60caff" font-weight="750">01 / YOLO26 五任务</text><text x="115" y="350" font-size="27" fill="#d6e2ed" font-weight="500">检测 / 分类 / 实例分割 / 姿态 / 旋转框</text><g transform="translate(137 384)"><path d="M12 14H78V68H12Z" fill="none" stroke="#60caff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(279 384)"><path d="M12 19H78M12 39H59M12 59H42" fill="none" stroke="#49e3ce" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(421 384)"><path d="M15 59Q0 12 44 7Q91 1 78 55Q54 84 15 59Z" fill="none" stroke="#60caff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(563 384)"><path d="M44 21V44M44 28L15 39M44 28L73 39M44 44L23 75M44 44L66 75M44 6A7 7 0 1 0 44 20A7 7 0 1 0 44 6" fill="none" stroke="#49e3ce" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(705 384)"><path d="M5 29L67 6L86 58L24 80Z" fill="none" stroke="#60caff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="115" y="515" font-size="28" fill="#eff6ff" font-weight="600">类别 · 框 · mask · 关键点 · 四边形</text><text x="115" y="562" font-size="25" fill="#a5b9d0" font-weight="500">MIGraphX GPU 推理 + HIP 数值前后处理</text><rect x="930" y="245" width="790" height="350" rx="22" fill="url(#card)" stroke="#49e3ce88" str