ff" font-weight="700">TEXT</text><text x="965" y="918" font-size="28" fill="#eff6ff" font-weight="600">候选排序 · 余弦相似度 · embedding</text><text x="965" y="962" font-size="25" fill="#a5b9d0" font-weight="500">双编码器 GPU；前处理、归一化与排序 CPU</text><path d="M80 1040H1720" fill="none" stroke="#294863" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="1083" font-size="23" fill="#a5b9d0" font-weight="500">核心 API 0.0.2 · 案例使用当前 main 源码</text><text x="1080" y="1083" font-size="23" fill="#a5b9d0" font-weight="500">技术关系示意，非模型运行截图</text></g></svg>
