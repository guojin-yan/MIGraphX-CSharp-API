<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1230" viewBox="0 0 1800 1230" role="img" aria-labelledby="title desc"><title id="title">MIGraphXSharp 托管层、系统原生运行库与 GPU 的关系</title><desc id="desc">MIGraphXSharp 0.0.1 首发文章原创技术配图，准确标签与数据由 SVG 排版。</desc><defs>
