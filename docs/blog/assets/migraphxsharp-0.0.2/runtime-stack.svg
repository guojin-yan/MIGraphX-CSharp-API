</defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect width="1800" height="1230" fill="url(#background)"/><rect width="1800" height="1230" fill="url(#grid)"/><ellipse cx="1450" cy="270" rx="720" ry="470" fill="url(#halo)"/><path d="M1120 0L1800 160" fill="none" stroke="#37c9e3" stroke-width="1.6" opacity=".15"/><path d="M1146 0L1800 178" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><path d="M1172 0L1800 196" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><path d="M1198 0L1800 214" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><path d="M1224 0L1800 232" fill="none" stroke="#37c9e3" stroke-width="1.6" opacity=".15"/><path d="M1250 0L1800 250" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><path d="M1276 0L1800 268" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><path d="M1302 0L1800 286" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><path d="M1328 0L1800 304" fill="none" stroke="#37c9e3" stroke-width="1.6" opacity=".15"/><path d="M1354 0L1800 322" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><path d="M1380 0L1800 340" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><path d="M1406 0L1800 358" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><path d="M1432 0L1800 376" fill="none" stroke="#37c9e3" stroke-width="1.6" opacity=".15"/><path d="M1458 0L1800 394" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><path d="M1484 0L1800 412" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><path d="M1510 0L1800 430" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><path d="M1536 0L1800 448" fill="none" stroke="#37c9e3" stroke-width="1.6" opacity=".15"/><path d="M1562 0L1800 466" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><path d="M1588 0L1800 484" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><path d="M1614 0L1800 502" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><text x="80" y="66" font-size="18" fill="#49e3ce" font-weight="650" letter-spacing="3">02 / RUNTIME ARCHITECTURE</text><text x="80" y="136" font-size="51" fill="#eef7ff" font-weight="750" >从 C# 应用，到 AMD GPU</text><text x="80" y="183" font-size="24" fill="#9fb7cf" font-weight="400" >核心推理是一条主路径；HIP 流与设备输入通过可选适配包接入。</text><rect x="80" y="238" width="1640" height="114" rx="24" fill="url(#card)" stroke="#385a7a" /><g transform="translate(112 262) scale(0.95)" fill="none" stroke="#eef7ff" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19L7 33L22 47M44 19L59 33L44 47M38 10L28 56"/></g><text x="216" y="287" font-size="33" fill="#eef7ff" font-weight="700" >C# / .NET 应用</text><text x="216" y="326" font-size="23" fill="#9fb7cf" font-weight="400" >模型输入、推理调用与业务逻辑</text><rect x="1325" y="274" width="350" height="40" rx="20" fill="#55bcff12" stroke="#55bcff88" /><text x="1500" y="301" font-size="18" fill="#55bcff" font-weight="650" text-anchor="middle" letter-spacing="1">托管代码 / Managed</text><path d="M560 353L560 407" fill="none" stroke="#49e3ce" stroke-width="3" marker-end="url(#arrow)"/><path d="M1372 353L1372 407" fill="none" stroke="#49e3ce" stroke-width="3" marker-end="url(#arrow)"/><rect x="80" y="422" width="970" height="177" rx="26" fill="url(#card)" stroke="#49e3ce88" /><g transform="translate(110 450) scale(0.95)" fill="none" stroke="#49e3ce" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 19L34 7L58 21V48L33 60L8 46ZM8 19L33 33L58 21M33 33V60M20 13L46 27V54M8 33L33 47L58 35"/></g><text x="210" y="477" font-size="37" fill="#eef7ff" font-weight="700" >MIGraphXSharp Core</text><text x="210" y="520" font-size="24" fill="#49e3ce" font-weight="400" >模型解析 · 编译 · 张量 · 执行 · 资源管理</text><text x="210" y="563" font-size="23" fill="#9fb7cf" font-weight="400" >核心包无需引用 HipSharp</text><rect x="1110" y="422" width="610" height="177" rx="26" fill="url(#card)" stroke="#ac99ff88" /><g transform="translate(1137 450) scale(0.9)" fill="none" stroke="#ac99ff" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M22 7V22M43 7V22M15 23H50V33Q50 47 33 47V60M18 59H48"/></g><text x="1235" y="476" font-size="30" fill="#eef7ff" font-weight="700" >HIP Interop（可选）</text><text x="1140" y="527" font-size="23" fill="#ac99ff" font-weight="400" >依赖 Core + HipSharp 0.10.0</text><text x="1140" y="566" font-size="23" fill="#9fb7cf" font-weight="400" >Stream 提交 / 设备缓冲区输入</text><path d="M1110 511L1058 511" fill="none" stroke="#ac99ff" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#purple-arrow)"/><text x="1080" y="490" font-size="16" fill="#ac99ff" font-weight="400" text-anchor="middle">依赖</text><rect x="80" y="654" width="1640" height="335" rx="28" fill="#071b29" stroke="#28605e" /><text x="110" y="691" font-size="18" fill="#49e3ce" font-weight="650" letter-spacing="3">SYSTEM NATIVE RUNTIME</text><rect x="1450" y="671" width="236" height="40" rx="20" fill="#9fb7cf12" stroke="#9fb7cf88" /><text x="1568" y="698" font-size="18" fill="#9fb7cf" font-weight="650" text-anchor="middle" letter-spacing="1">由系统单独安装</text><path d="M560 600L560 722" fill="none" stroke="#49e3ce" stroke-width="3" marker-end="url(#arrow)"/><text x="584" y="635" font-size="21" fill="#49e3ce" font-weight="400" >C ABI</text><rect x="130" y="735" width="850" height="90" rx="18" fill="#123247" stroke="#448e9d" /><text x="555" y="792" font-size="31" fill="#eef7ff" font-weight="650" text-anchor="middle">AMD MIGraphX  ·  libmigraphx_c.so</text><path d="M1370 599L1370 861" fill="none" stroke="#49e3ce" stroke-width="3" stroke-dasharray="6 8" marker-end="url(#arrow)"/><text x="1400" y="750" font-size="22" fill="#ac99ff" font-weight="400" >经 HipSharp</text><path d="M555 825L555 861" fill="none" stroke="#49e3ce" stroke-width="3" marker-end="url(#arrow)"/><rect x="130" y="878" width="1540" height="73" rx="18" fill="#0f2a3d" stroke="#397c88" /><text x="900" y="926" font-size="29" fill="#eef7ff" font-weight="650" text-anchor="middle">ROCm / HIP Runtime  +  AMD 驱动</text><path d="M900 990L900 1032" fill="none" stroke="#49e3ce" stroke-width="3" marker-end="url(#arrow)"/><rect x="300" y="1048" width="1200" height="94" rx="24" fill="url(#chip)" stroke="#55bcff88" /><g transform="translate(335 1062) scale(0.9)" fill="none" stroke="#49e3ce" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="14" width="38" height="38" rx="6"/><rect x="23" y="23" width="20" height="20" rx="2"/><path d="M22 5V14M33 5V14M44 5V14M22 52V61M33 52V61M44 52V61M5 22H14M5 33H14M5 44H14M52 22H61M52 33H61M52 44H61"/></g><text x="925" y="1108" font-size="40" fill="#eef7ff" font-weight="750" text-anchor="middle">AMD GPU</text><path d="M80 1160L1720 1160" fill="none" stroke="#24405b" stroke-width="1" /><text x="80" y="1198" font-size="17" fill="#9fb7cf" font-weight="500" >MIGraphXSharp  /  v0.0.1</text><text x="1720" y="1198" font-size="17" fill="#9fb7cf" font-weight="400" text-anchor="end">NuGet 提供托管层；驱动、ROCm 与 MIGraphX 决定原生运行条件</text></g></svg>