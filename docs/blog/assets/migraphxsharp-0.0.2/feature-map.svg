<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc"><title id="title">MIGraphXSharp 六项工程特色</title><desc id="desc">MIGraphXSharp 0.0.2 发布文章原创技术配图，准确标签与数据由 SVG 排版。</desc><defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050d1b"/><stop offset=".52" stop-color="#09192c"/><stop offset="1" stop-color="#05101d"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10263f"/><stop offset="1" stop-color="#0a1829"/></linearGradient>
  <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#36b6eb"/><stop offset="1" stop-color="#64f1c5"/></linearGradient>
  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7777ed"/><stop offset="1" stop-color="#c2a7ff"/></linearGradient>
  <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fe987a"/><stop offset="1" stop-color="#ffda96"/></linearGradient>
  <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1d657f"/><stop offset=".5" stop-color="#103856"/><stop offset="1" stop-color="#172f60"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#0d8694" stop-opacity=".27"/><stop offset="1" stop-color="#062c42" stop-opacity="0"/></radialGradient>
