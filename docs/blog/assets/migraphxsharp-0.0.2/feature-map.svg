  <marker id="purple-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L9 5L0 10" fill="none" stroke="#ac99ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect width="1800" height="1000" fill="url(#background)"/><rect width="1800" height="1000" fill="url(#grid)"/><ellipse cx="1450" cy="270" rx="720" ry="470" fill="url(#halo)"/><path d="M1120 0L1800 160" fill="none" stroke="#37c9e3" stroke-width="1.6" opacity=".15"/><path d="M1146 0L1800 178" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><path d="M1172 0L1800 196" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><path d="M1198 0L1800 214" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><path d="M1224 0L1800 232" fill="none" stroke="#37c9e3" stroke-width="1.6" opacity=".15"/><path d="M1250 0L1800 250" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><path d="M1276 0L1800 268" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><path d="M1302 0L1800 286" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><path d="M1328 0L1800 304" fill="none" stroke="#37c9e3" stroke-width="1.6" opacity=".15"/><path d="M1354 0L1800 322" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><path d="M1380 0L1800 340" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><path d="M1406 0L1800 358" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><path d="M1432 0L1800 376" fill="none" stroke="#37c9e3" stroke-width="1.6" opacity=".15"/><path d="M1458 0L1800 394" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><path d="M1484 0L1800 412" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><path d="M1510 0L1800 430" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><path d="M1536 0L1800 448" fill="none" stroke="#37c9e3" stroke-width="1.6" opacity=".15"/><path d="M1562 0L1800 466" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><path d="M1588 0L1800 484" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><path d="M1614 0L1800 502" fill="none" stroke="#234c77" stroke-width="0.8" opacity=".15"/><text x="80" y="66" font-size="18" fill="#49e3ce" font-weight="650" letter-spacing="3">01 / ENGINEERING FEATURES</text><text x="80" y="136" font-size="51" fill="#eef7ff" font-weight="750" >把原生推理，接进熟悉的 C# 工程</text><text x="80" y="183" font-size="24" fill="#9fb7cf" font-weight="400" >六项工程能力，覆盖模型接入、资源管理和部署排错。</text><rect x="80" y="246" width="530" height="284" rx="26" fill="url(#card)" stroke="#49e3ce65" /><rect x="105" y="271" width="82" height="82" rx="22" fill="#49e3ce0b" stroke="#49e3ce33" /><g transform="translate(114 279) scale(1)" fill="none" stroke="#49e3ce" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19L7 33L22 47M44 19L59 33L44 47M38 10L28 56"/></g><text x="569" y="311" font-size="31" fill="#49e3ce" font-weight="600" text-anchor="end" opacity=".8">01</text><text x="108" y="399" font-size="30" fill="#eef7ff" font-weight="700" >类型化 .NET API</text><text x="108" y="448" font-size="23" fill="#49e3ce" font-weight="500" >Shape · Argument · ParameterMap</text><text x="108" y="489" font-size="22" fill="#9fb7cf" font-weight="400" >明确张量类型、尺寸与参数名称</text><rect x="635" y="246" width="530" height="284" rx="26" fill="url(#card)" stroke="#55bcff65" /><rect x="660" y="271" width="82" height="82" rx="22" fill="#55bcff0b" stroke="#55bcff33" /><g transform="translate(669 279) scale(1)" fill="none" stroke="#55bcff" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M33 7L56 16V32Q55 49 33 60Q11 49 10 32V16Z"/><path d="M22 33L29 40L45 24"/></g><text x="1124" y="311" font-size="31" fill="#55bcff" font-weight="600" text-anchor="end" opacity=".8">02</text><text x="663" y="399" font-size="30" fill="#eef7ff" font-weight="700" >原生资源有明确归属</text><text x="663" y="448" font-size="23" fill="#55bcff" font-weight="500" >IDisposable · 生命周期保留</text><text x="663" y="489" font-size="22" fill="#9fb7cf" font-weight="400" >用 using 表达确定的释放边界</text><rect x="1190" y="246" width="530" height="284" rx="26" fill="url(#card)" stroke="#ac99ff65" /><rect x="1215" y="271" width="82" height="82" rx="22" fill="#ac99ff0b" stroke="#ac99ff33" /><g transform="translate(1224 279) scale(1)" fill="none" stroke="#ac99ff" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 19A24 24 0 1 1 9 40M13 7V20H26"/><path d="M33 18V34L44 41"/></g><text x="1679" y="311" font-size="31" fill="#ac99ff" font-weight="600" text-anchor="end" opacity=".8">03</text><text x="1218" y="399" font-size="30" fill="#eef7ff" font-weight="700" >模型编译与复用</text><text x="1218" y="448" font-size="23" fill="#ac99ff" font-weight="500" >动态尺寸 · 持久化 · 编译缓存</text><text x="1218" y="489" font-size="22" fill="#9fb7cf" font-weight="400" >按模型与环境身份管理缓存</text><rect x="80" y="556" width="530" height="284" rx="26" fill="url(#card)" stroke="#49e3ce65" /><rect x="105" y="581" width="82" height="82" rx="22" fill="#49e3ce0b" stroke="#49e3ce33" /><g transform="translate(114 589) scale(1)" fill="none" stroke="#49e3ce" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M22 7V22M43 7V22M15 23H50V33Q50 47 33 47V60M18 59H48"/></g><text x="569" y="621" font-size="31" fill="#49e3ce" font-weight="600" text-anchor="end" opacity=".8">04</text><text x="108" y="709" font-size="30" fill="#eef7ff" font-weight="700" >核心包独立，HIP 可选</text><text x="108" y="758" font-size="23" fill="#49e3ce" font-weight="500" >Core → 模型推理</text><text x="108" y="799" font-size="22" fill="#9fb7cf" font-weight="400" >Interop → 流与设备输入输出</text><rect x="635" y="556" width="530" height="284" rx="26" fill="url(#card)" stroke="#ffd28b65" /><rect x="660" y="581" width="82" height="82" rx="22" fill="#ffd28b0b" stroke="#ffd28b33" /><g transform="translate(669 589) scale(1)" fill="none" stroke="#ffd28b" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="28" cy="27" r="18"/><path d="M42 41L59 58M17 27H23L27 19L32 35L37 27H42"/></g><text x="1124" y="621" font-size="31" fill="#ffd28b" font-weight="600" text-anchor="end" opacity=".8">05</text><text x="663" y="709" font-size="30" fill="#eef7ff" font-weight="700" >部署问题可以追踪</text><text x="663" y="758" font-size="23" fill="#ffd28b" font-weight="500" >绝对库路径 · 结构化加载诊断</text><text x="663" y="799" font-size="22" fill="#9fb7cf" font-weight="400" >从加载问题定位到原生运行环境</text><rect x="1190" y="556" width="530" height="284" rx="26" fill="url(#card)" stroke="#55bcff65" /><rect x="1215" y="581" width="82" height="82" rx="22" fill="#55bcff0b" stroke="#55bcff33" /><g transform="translate(1224 589) scale(1)" fill="none" stroke="#55bcff" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 23L33 8L61 23L33 38ZM5 35L33 50L61 35M5 47L33 62L61 47"/></g><text x="1679" y="621" font-size="31" fill="#55bcff" font-weight="600" text-anchor="end" opacity=".8">06</text><text x="1218" y="709" font-size="30" fill="#eef7ff" font-weight="700" >兼顾已有 .NET 工程</text><text x="1218" y="758" font-size="23" fill="#55bcff" font-weight="500" >15 个目标框架 · 中英 XML 文档</text><text x="1218" y="799" font-size="22" fill="#9fb7cf" font-weight="400" >托管框架兼容与 GPU 平台分开说明</text><path d="M80 930L1720 930" fill="none" stroke="#24405b" stroke-width="1" /><text x="80" y="968" font-size="17" fill="#9fb7cf" font-weight="500" >MIGraphXSharp  /  v0.0.2</text><text x="1720" y="968" font-size="17" fill="#9fb7cf" font-weight="400" text-anchor="end">托管 API 的可用性，来自清楚的类型、归属和运行边界</text></g></svg>