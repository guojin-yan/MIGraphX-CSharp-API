<text x="474" y="667" font-size="24" fill="#a5b9d0" font-family="Microsoft YaHei" font-weight="400" dominant-baseline="text-before-edge">框、分数、类别与关键点</text>
<text x="890" y="697" font-size="26" fill="#a5b9d0" font-family="Microsoft YaHei" font-weight="400" dominant-baseline="text-before-edge">mask 保存时才回传；不是零复制</text>
<text x="64" y="849" font-size="22" fill="#a5b9d0" font-family="Microsoft YaHei" font-weight="400" dominant-baseline="text-before-edge">同一 stream 有序提交：前处理 → 模型 → D2D → 后处理；完成后再复用缓冲区。</text>
