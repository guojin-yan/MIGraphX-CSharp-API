<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc"><title id="title">YOLO26：从主机张量到设备缓冲</title><desc id="desc">MIGraphX CSharp API 技术案例调用图。同一个模型生命周期，两种输入输出路径；后处理按实际张量形状解释。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081322"/><stop offset="1" stop-color="#0c1d33"/></linearGradient><linearGradient id="panel" x2="1" y2="1"><stop stop-color="#142d47"/><stop offset="1" stop-color="#0b1b30"/></linearGradient><pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#48d6f2" stroke-opacity=".05"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="1800" height="1120" fill="url(#bg)"/><rect width="1800" height="1120" fill="url(#grid)"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="80" y="64" font-size="22" fill="#48d6f2" font-weight="700" letter-spacing="1">MIGraphX CSharp API / MODEL INTEGRATION</text><text x="80" y="141" font-size="48" fill="#eff6ff" font-weight="750" >YOLO26：从主机张量到设备缓冲</text><text x="80" y="193" font-size="25" fill="#a5b9d0" font-weight="500" >同一个模型生命周期，两种输入输出路径；后处理按实际张量形状解释。</text><rect x="80" y="248" width="480" height="132" rx="20" fill="url(#panel)" stroke="#48d6f2" stroke-opacity=".55" stroke-width="1.5"/><text x="104" y="291" font-size="29" fill="#48d6f2" font-weight="700" >MIGraphXOnnxOptions</text><text x="104" y="332" font-size="24" fill="#a5b9d0" font-weight="500" >SetInputParameterShape(name, shape)</text><path d="M575 314H635" fill="none" stroke="#48d6f2" stroke-width="3"  marker-end="url(#arrow)"/><rect x="650" y="248" width="480" height="132" rx="20" fill="url(#panel)" stroke="#48d6f2" stroke-opacity=".55" stroke-width="1.5"/><text x="674" y="291" font-size="29" fill="#48d6f2" font-weight="700" >MIGraphXProgram</text><text x="674" y="332" font-size="24" fill="#a5b9d0" font-weight="500" >ParseOnnxFile → GetParameterShapes</text><path d="M1145 314H1205" fill="none" stroke="#48d6f2" stroke-width="3"  marker-end="url(#arrow)"/><rect x="1220" y="248" width="500" height="132" rx="20" fill="url(#panel)" stroke="#48d6f2" stroke-opacity=".55" stroke-width="1.5"/><text x="1244" y="291" font-size="29" fill="#48d6f2" font-weight="700" >Compile(target, options)</text><text x="1244" y="332" font-size="24" fill="#a5b9d0" font-weight="500" >gpu target · 明确 offloadCopy</text><text x="80" y="445" font-size="22" fill="#67e3b6" font-weight="700" letter-spacing="1">HOST PATH / offloadCopy: true</text><rect x="80" y="480" width="480" height="158" rx="20" fill="url(#panel)" stroke="#48d6f2" stroke-opacity=".55" stroke-width="1.5"/><text x="104" y="523" font-size="29" fill="#48d6f2" font-weight="700" >float[] + MIGraphXShape</text><text x="104" y="564" font-size="24" fill="#a5b9d0" font-weight="500" >float32 [1,3,640,640]</text><text x="104" y="599" font-size="24" fill="#a5b9d0" font-weight="500" >Images 准备 NCHW 数据</text><path d="M575 560H635" fill="none" stroke="#67e3b6" stroke-width="3"  marker-end="url(#arrow)"/><rect x="650" y="480" width="480" height="158" rx="20" fill="url(#panel)" stroke="#67e3b6" stroke-opacity=".55" stroke-width="1.5"/><text x="674" y="523" font-size="29" fill="#67e3b6" font-weight="700" >Argument + ParameterMap</text><text x="674" y="564" font-size="24" fill="#a5b9d0" font-weight="500" >Create(native, shape, values)</text><text x="674" y="599" font-size="24" fill="#a5b9d0" font-weight="500" >Add("images", argument)</text><path d="M1145 560H1205" fill="none" stroke="#67e3b6" stroke-width="3"  marker-end="url(#arrow)"/><rect x="1220" y="480" width="500" height="158" rx="20" fill="url(#panel)" stroke="#ffc875" stroke-opacity=".55" stroke-width="1.5"/><text x="1244" y="523" font-size="29" fill="#ffc875" font-weight="700" >Run → ToArray&lt;float&gt;()</text><text x="1244" y="564" font-size="24" fill="#a5b9d0" font-weight="500" >检测 [1,N,6]；分割有两个输出</text><text x="1244" y="599" font-size="24" fill="#a5b9d0" font-weight="500" >输出集合 using；数组独立保留</text><text x="80" y="704" font-size="22" fill="#beabff" font-weight="700" letter-spacing="1">DEVICE PATH / offloadCopy: false</text><rect x="80" y="740" width="480" height="175" rx="20" fill="url(#panel)" stroke="#beabff" stroke-opacity=".55" stroke-width="1.5"/><text x="104" y="783" font-size="29" fill="#beabff" font-weight="700" >MIGraphXHipDeviceInput</text><text x="104" y="824" font-size="24" fill="#a5b9d0" font-weight="500" >编译后全部参数 → 独立显存</text><text x="104" y="859" font-size="24" fill="#a5b9d0" font-weight="500" >outputs → 另分配目标缓冲</text><path d="M575 825H635" fill="none" stroke="#beabff" stroke-width="3"  marker-end="url(#arrow)"/><rect x="650" y="740" width="480" height="175" rx="20" fill="url(#panel)" stroke="#67e3b6" stroke-opacity=".55" stroke-width="1.5"/><text x="674" y="783" font-size="29" fill="#67e3b6" font-weight="700" >RunDeviceIntoAsync</text><text x="674" y="824" font-size="24" fill="#a5b9d0" font-weight="500" >模型执行 → 有序 D2D 复制</text><text x="674" y="859" font-size="24" fill="#a5b9d0" font-weight="500" >同一 stream 接后处理 kernel</text><path d="M1145 825H1205" fill="none" stroke="#beabff" stroke-width="3"  marker-end="url(#arrow)"/><rect x="1220" y="740" width="500" height="175" rx="20" fill="url(#panel)" stroke="#ffc875" stroke-opacity=".55" stroke-width="1.5"/><text x="1244" y="783" font-size="29" fill="#ffc875" font-weight="700" >Synchronize → 紧凑回传</text><text x="1244" y="824" font-size="24" fill="#a5b9d0" font-weight="500" >完成后读 CPU 结果或复用缓冲</text><text x="1244" y="859" font-size="24" fill="#a5b9d0" font-weight="500" >设备路径没有 run.Outputs</text><path d="M80 1035H1720" stroke="#294361"/><text x="80" y="1077" font-size="23" fill="#a5b9d0" font-weight="500" >设备输入输出使用调用方缓冲；D2D 仍存在，不能称为零复制。</text><text x="1720" y="1077" font-size="20" fill="#a5b9d0" font-weight="500" text-anchor="end">Core 0.0.2 · main samples</text></g></svg>
